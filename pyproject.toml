[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "labtrack"
version = "1.0.0"
description = "Gestor de Laboratorio de Investigación con Trazabilidad"
authors = [
    { name = "Grupo 2", email = "grupo2@universidad.es" }
]
readme = "README.md"
requires-python = ">=3.10"

# Dependencias de ejecución (runtime): vacío porque usa exclusivamente la librería estándar de Python
dependencies = []

# Dependencias opcionales aisladas por perfil (pruebas y desarrollo)
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pdoc>=14.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
labtrack = "src.cli.main:ejecutar_flujo_principal"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--cov=src"
testpaths = [
    "tests",
]