[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "labtrack"
version = "1.0.0"
description = "Gestor de Laboratorio de Investigación con Trazabilidad"
authors = [
    { name = "Grupo 2", email = "grupo2@universidad.es" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--cov=src"
testpaths = [
    "tests",
]