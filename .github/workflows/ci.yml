name: CI - LabTrack Quality & Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de desarrollo
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Comprobar estilo PEP 8 (Black)
        run: python -m black --check src tests

      - name: Comprobar linting (Ruff)
        run: python -m ruff check src tests

      - name: Ejecutar pruebas y verificar cobertura (>= 70%)
        run: python -m pytest --cov=src --cov-fail-under=70 tests/